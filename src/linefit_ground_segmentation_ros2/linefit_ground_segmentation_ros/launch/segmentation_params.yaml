ground_segmentation:
  ros__parameters:
    n_threads: 6                # 使用的线程数

    r_min: 0.2                  # 最小点距离
    r_max: 12.0                 # 最大点距离，和2D投影/SLAM有效距离保持一致
    n_bins: 100                 # 径向bin的数量
    n_segments: 180             # 径向分段的数量，2度/段能降低Livox稀疏点云的抖动

    max_dist_to_line: 0.08      # 点被认为是地面的到直线的最大垂直距离

    sensor_height: 0.6          # 传感器离地高度
    min_slope: 0.0              # 地面线的最小斜率
    max_slope: 0.3              # 地面线的最大斜率
    max_fit_error: 0.08         # 直线拟合期间点的最大误差
    long_threshold: 1.0         # 点之间被认为相距较远的距离阈值
    max_long_height: 0.15       # 长线中与前一个点的最大高度变化
    max_start_height: 0.25      # 开始新线的估计地面高度的最大差异
    line_search_angle: 0.15     # 在角度方向上搜索以找到直线的范围[弧度]

    gravity_aligned_frame: "camera_init" # 用FAST-LIO世界系做重力对齐，但输出仍保持body系
    latch: false                # latch output topics or not
    visualize: false            # 可视化分割结果 - 仅用于调试

    # input_topic: "livox/lidar/pointcloud"          # 输入点云话题
    
    input_topic: "/cloud_registered_body" 
    obstacle_output_topic: "segmentation/obstacle" # 障碍物点云输出话题
    ground_output_topic: "segmentation/ground"     # 地面点云输出话题
